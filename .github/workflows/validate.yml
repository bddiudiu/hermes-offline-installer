name: Validate Offline Installer

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      build_candidate:
        description: "Repack the pinned Windows runtime and run installed-layout upgrade/rollback acceptance"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate scripts and packaging
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Check Python packaging scripts
        run: python -m py_compile packaging/build_wheelhouse.py packaging/build_bundle.py packaging/repack_bundle.py packaging/manifest.py packaging/read_hermes_version.py packaging/resolve_hermes_source.py scripts/configure_config.py scripts/hermes_version.py scripts/upgrade_support.py scripts/smoke_upgrade_data.py

      - name: Install upgrade test parser dependencies
        run: python -m pip install PyYAML==6.0.3 python-dotenv==1.2.2 ruamel.yaml==0.18.16

      - name: Run packaging regression tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Test Windows PowerShell 5.1 upgrade functions
        shell: powershell
        run: .\tests\test_upgrade_functions.ps1

      - name: Check Unix shell script syntax
        shell: bash
        run: |
          bash -n installers/install_unix.sh
          bash -n scripts/verify_unix.sh

      - name: Check Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          foreach ($script in @(
            "installers/install_windows.ps1",
            "installers/install_windows_silent.ps1",
            "installers/launch_windows.ps1",
            "installers/repair_windows.ps1",
            "installers/upgrade.ps1",
            "installers/shutdown_windows.ps1",
            "installers/uninstall_windows.ps1",
            "scripts/verify_windows.ps1",
            "scripts/smoke_windows.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script,
              [ref] $tokens,
              [ref] $errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

      - name: Repack verified Windows runtime with current installer sources
        if: ${{ inputs.build_candidate }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          curl.exe --fail --location --silent --show-error --retry 3 --max-time 300 https://github.com/bddiudiu/hermes-offline-installer/releases/download/v0.22.2-106/hermes-offline-installer-win-x64.zip -o build/base.zip
          if ($LASTEXITCODE -ne 0) { throw 'Base release download failed.' }
          python packaging/repack_bundle.py --archive build/base.zip --sha256 b9ad81224edbaacc34a58525cbfe8684d2035d7bdb556b460bbbc417e2a1ce75 --output dist
          if ($LASTEXITCODE -ne 0) { throw 'Candidate repack failed.' }

      - name: Verify upgrade without the old extracted installer
        if: ${{ inputs.build_candidate }}
        shell: powershell
        timeout-minutes: 40
        run: |
          .\scripts\smoke_windows.ps1 -Archive dist\hermes-offline-installer-win-x64.zip -LegacyTag v0.21.5-92
          if ($LASTEXITCODE -ne 0) { throw 'Windows acceptance failed.' }
          Get-Content dist\repack-verification.json

      - name: Upload validated Windows candidate
        if: ${{ inputs.build_candidate }}
        uses: actions/upload-artifact@v4
        with:
          name: hermes-windows-candidate-${{ github.run_id }}
          path: dist/*
          compression-level: 0
          retention-days: 7
