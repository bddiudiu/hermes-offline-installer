name: Validate Offline Installer

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate scripts and packaging
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check Python packaging scripts
        run: python -m py_compile packaging/build_wheelhouse.py packaging/build_bundle.py packaging/manifest.py packaging/read_hermes_version.py packaging/resolve_hermes_source.py scripts/configure_config.py scripts/upgrade_support.py

      - name: Install upgrade test parser dependencies
        run: python -m pip install PyYAML==6.0.3 python-dotenv==1.2.2

      - name: Run packaging regression tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Test Windows PowerShell 5.1 upgrade functions
        shell: powershell
        run: .\tests\test_upgrade_functions.ps1

      - name: Check Unix shell script syntax
        shell: bash
        run: |
          bash -n installers/install_unix.sh
          bash -n scripts/verify_unix.sh

      - name: Check Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          foreach ($script in @(
            "installers/install_windows.ps1",
            "installers/install_windows_silent.ps1",
            "installers/launch_windows.ps1",
            "installers/repair_windows.ps1",
            "installers/upgrade.ps1",
            "installers/shutdown_windows.ps1",
            "installers/uninstall_windows.ps1",
            "scripts/verify_windows.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script,
              [ref] $tokens,
              [ref] $errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }
