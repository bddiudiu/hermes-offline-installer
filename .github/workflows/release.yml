name: Build Hermes Offline Installer

on:
  workflow_dispatch:
    inputs:
      hermes_source:
        description: "Hermes package spec"
        required: false
        default: "hermes-agent @ git+https://github.com/NousResearch/hermes-agent.git"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac-arm64
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip uv

      - name: Build wheelhouse
        shell: bash
        env:
          HERMES_SOURCE: ${{ github.event.inputs.hermes_source || 'hermes-agent @ git+https://github.com/NousResearch/hermes-agent.git' }}
        run: python packaging/build_wheelhouse.py --platform "${{ matrix.target }}" --output build/wheelhouse

      - name: Read Hermes Agent version
        shell: bash
        run: python packaging/read_hermes_version.py --wheelhouse build/wheelhouse > build/hermes-agent-version.txt

      - name: Build bundle
        shell: bash
        run: python packaging/build_bundle.py --platform "${{ matrix.target }}" --wheelhouse build/wheelhouse --output dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-offline-installer-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      - name: Upload Hermes Agent version
        uses: actions/upload-artifact@v4
        with:
          name: hermes-agent-version-${{ matrix.target }}
          path: build/hermes-agent-version.txt
          if-no-files-found: error

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hermes-offline-installer-*
          path: release-assets
          merge-multiple: true

      - name: Download version artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hermes-agent-version-*
          path: versions

      - name: Prepare release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(find versions -name hermes-agent-version.txt -print -quit | xargs cat | tr -d '[:space:]')"
          if [ -z "$version" ]; then
            echo "Hermes Agent version is empty" >&2
            exit 1
          fi
          tag="v${version}-${GITHUB_RUN_NUMBER}"
          {
            echo "hermes_version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Hermes Agent ${{ steps.release.outputs.hermes_version }} build ${{ github.run_number }}
          body: |
            Hermes Agent version: ${{ steps.release.outputs.hermes_version }}
            GitHub Actions run: ${{ github.run_number }}
          files: release-assets/*
