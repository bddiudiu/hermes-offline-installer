name: Build Hermes Offline Installer

on:
  workflow_dispatch:
    inputs:
      hermes_tag:
        description: "Upstream Hermes release tag override, e.g. v2026.7.1"
        required: false
        default: ""
      hermes_extras:
        description: "Hermes extras to pre-bake into the offline source install"
        required: false
        default: "all"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Windows long path support
        run: git config --global core.longpaths true

      - name: Install build tooling
        run: python -m pip install --upgrade pip uv

      - name: Resolve Hermes source
        shell: bash
        env:
          HERMES_TAG_INPUT: ${{ github.event.inputs.hermes_tag || '' }}
        run: |
          set -euo pipefail
          mkdir -p build
          args=()
          if [ -n "$HERMES_TAG_INPUT" ]; then
            args+=(--tag "$HERMES_TAG_INPUT")
          fi
          python packaging/resolve_hermes_source.py "${args[@]}" | tee build/hermes-source.env
          cat build/hermes-source.env >> "$GITHUB_ENV"
          awk -F= '/^HERMES_UPSTREAM_TAG=/{print substr($0, index($0, "=") + 1)}' build/hermes-source.env > build/hermes-upstream-tag.txt

      - name: Build wheelhouse
        shell: bash
        run: python packaging/build_wheelhouse.py --platform "${{ matrix.target }}" --extras "${{ github.event.inputs.hermes_extras || 'all' }}" --output build/wheelhouse

      - name: Read Hermes Agent version
        shell: bash
        run: python packaging/read_hermes_version.py --wheelhouse build/wheelhouse > build/hermes-agent-version.txt

      - name: Build bundle
        shell: bash
        run: python packaging/build_bundle.py --platform "${{ matrix.target }}" --wheelhouse build/wheelhouse --output dist

      - name: Generate checksums
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          for file in *.zip *.tar.gz; do
            [ -e "$file" ] || continue
            sha256sum "$file" > "$file.sha256"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-offline-installer-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      - name: Upload Hermes Agent version
        uses: actions/upload-artifact@v4
        with:
          name: hermes-agent-version-${{ matrix.target }}
          path: build/hermes-agent-version.txt
          if-no-files-found: error

      - name: Upload Hermes upstream tag
        uses: actions/upload-artifact@v4
        with:
          name: hermes-upstream-tag-${{ matrix.target }}
          path: build/hermes-upstream-tag.txt
          if-no-files-found: error

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hermes-offline-installer-*
          path: release-assets
          merge-multiple: true

      - name: Download version artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hermes-agent-version-*
          path: versions

      - name: Download upstream tag artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hermes-upstream-tag-*
          path: upstream-tags

      - name: Prepare release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(find versions -name hermes-agent-version.txt -print -quit | xargs cat | tr -d '[:space:]')"
          if [ -z "$version" ]; then
            echo "Hermes Agent version is empty" >&2
            exit 1
          fi
          upstream_tag="$(find upstream-tags -name hermes-upstream-tag.txt -print -quit | xargs cat | tr -d '[:space:]')"
          if [ -z "$upstream_tag" ]; then
            echo "Hermes upstream tag is empty" >&2
            exit 1
          fi
          tag="v${version}-${GITHUB_RUN_NUMBER}"
          previous_tag="$(git tag --list 'v*' --sort=-creatordate | head -n 1 || true)"
          if [ -n "$previous_tag" ]; then
            changes="$(git log --pretty=format:'- %s (%h)' "${previous_tag}..HEAD")"
          else
            changes="$(git log --pretty=format:'- %s (%h)' -n 20)"
          fi
          if [ -z "$changes" ]; then
            changes="- No repository changes detected for this build."
          fi
          {
            echo "hermes_version=$version"
            echo "hermes_upstream_tag=$upstream_tag"
            echo "tag=$tag"
            echo "changes<<EOF"
            echo "$changes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Hermes Agent ${{ steps.release.outputs.hermes_version }} build ${{ github.run_number }}
          body: |
            Hermes Agent version: ${{ steps.release.outputs.hermes_version }}
            Hermes upstream tag: ${{ steps.release.outputs.hermes_upstream_tag }}
            GitHub Actions run: ${{ github.run_number }}

            Changes in this build:
            ${{ steps.release.outputs.changes }}
          files: release-assets/*

  upload-oss:
    name: Upload to OSS
    runs-on: ubuntu-latest
    needs: [build, release]
    env:
      ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
      ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
      ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
      ALIYUN_OSS_PUBLIC_BASE_URL: ${{ secrets.ALIYUN_OSS_PUBLIC_BASE_URL }}
      ALIYUN_OSS_PREFIX: ${{ vars.ALIYUN_OSS_PREFIX || 'hermes' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hermes-offline-installer-*
          path: upload
          merge-multiple: true

      - name: Download version artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hermes-agent-version-*
          path: versions

      - name: Download upstream tag artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hermes-upstream-tag-*
          path: upstream-tags

      - name: Prepare OSS metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(find versions -name hermes-agent-version.txt -print -quit | xargs cat | tr -d '[:space:]')"
          if [ -z "$version" ]; then
            echo "Hermes Agent version is empty" >&2
            exit 1
          fi
          upstream_tag="$(find upstream-tags -name hermes-upstream-tag.txt -print -quit | xargs cat | tr -d '[:space:]')"
          if [ -z "$upstream_tag" ]; then
            echo "Hermes upstream tag is empty" >&2
            exit 1
          fi
          build_version="${version}-${GITHUB_RUN_NUMBER}"
          path_prefix="${ALIYUN_OSS_PREFIX%/}/${build_version}"
          {
            echo "hermes_version=$version"
            echo "hermes_upstream_tag=$upstream_tag"
            echo "build_version=$build_version"
            echo "path_prefix=$path_prefix"
          } >> "$GITHUB_OUTPUT"

      - name: Generate latest.json
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ALIYUN_OSS_PUBLIC_BASE_URL:-}" ]; then
            echo "ALIYUN_OSS_PUBLIC_BASE_URL is required" >&2
            exit 1
          fi
          version="${{ steps.meta.outputs.build_version }}"
          path_prefix="${{ steps.meta.outputs.path_prefix }}"
          zip_name="$(find upload -maxdepth 1 -type f -name 'hermes-offline-installer-win-x64.zip' -print -quit)"
          if [ -z "$zip_name" ]; then
            echo "Windows zip not found in upload/" >&2
            exit 1
          fi
          zip_name="$(basename "$zip_name")"
          cat > upload/latest.json <<EOF
          {
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "upstream_tag": "${{ steps.meta.outputs.hermes_upstream_tag }}",
            "editions": {
              "en": { "version": "$version", "base_url": "${ALIYUN_OSS_PUBLIC_BASE_URL%/}/$path_prefix/$zip_name" }
            }
          }
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install OSS SDK
        run: python -m pip install oss2

      - name: Upload files to OSS
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import os
          from pathlib import Path

          import oss2

          required = [
              "ALIYUN_OSS_BUCKET",
              "ALIYUN_OSS_ENDPOINT",
              "ALIYUN_OSS_ACCESS_KEY_ID",
              "ALIYUN_OSS_ACCESS_KEY_SECRET",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(f"Missing OSS environment variables: {', '.join(missing)}")

          endpoint = os.environ["ALIYUN_OSS_ENDPOINT"].strip()
          if "://" not in endpoint:
              endpoint = f"https://{endpoint}"

          prefix = os.environ.get("ALIYUN_OSS_PREFIX", "hermes").strip("/")
          path_prefix = "${{ steps.meta.outputs.path_prefix }}"

          auth = oss2.Auth(os.environ["ALIYUN_OSS_ACCESS_KEY_ID"], os.environ["ALIYUN_OSS_ACCESS_KEY_SECRET"])
          bucket = oss2.Bucket(auth, endpoint, os.environ["ALIYUN_OSS_BUCKET"])

          failed = []
          for path in sorted(Path("upload").iterdir()):
              if not path.is_file() or path.name == "latest.json":
                  continue
              object_key = f"{path_prefix}/{path.name}"
              print(f"Uploading {path.name} -> oss://{os.environ['ALIYUN_OSS_BUCKET']}/{object_key}")
              result = bucket.put_object_from_file(object_key, str(path))
              status = getattr(result, "status", None)
              if not (status and 200 <= status < 300):
                  failed.append(f"{path.name} (status={status})")

          latest_key = f"{prefix}/latest.json"
          print(f"Uploading latest.json -> oss://{os.environ['ALIYUN_OSS_BUCKET']}/{latest_key}")
          result = bucket.put_object_from_file(
              latest_key,
              "upload/latest.json",
              headers={"Content-Type": "application/json"},
          )
          status = getattr(result, "status", None)
          if not (status and 200 <= status < 300):
              failed.append(f"latest.json (status={status})")

          if failed:
              raise SystemExit("Upload failed for: " + ", ".join(failed))

          print("OSS upload complete")
          PY
