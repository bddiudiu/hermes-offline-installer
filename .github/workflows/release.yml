name: Build Hermes Offline Installer

on:
  workflow_dispatch:
    inputs:
      hermes_tag:
        description: "Upstream Hermes release tag override, e.g. v2026.7.1"
        required: false
        default: ""
      update_root_latest:
        description: "Promote this build to the root latest.json (default preserves the live update channel)"
        required: false
        type: boolean
        default: false
      hermes_extras:
        description: "Hermes extras to pre-bake into the offline source install"
        required: false
        default: "all"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    # Build, release and version-scoped OSS upload share this validated workspace.
    # No GitHub Actions Artifact storage is required for inter-job handoff.
    name: Build and publish Windows candidate
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Enable Windows long path support
        run: git config --global core.longpaths true

      - name: Install build tooling
        run: python -m pip install --upgrade pip "uv==0.12.7"

      - name: Validate upgrade and packaging contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install PyYAML==6.0.3 python-dotenv==1.2.2
          python -m py_compile packaging/build_wheelhouse.py packaging/build_bundle.py scripts/upgrade_support.py scripts/upload_oss.py
          python -m unittest discover -s tests -p "test_*.py"

      - name: Parse Windows PowerShell 5.1 scripts
        shell: powershell
        run: |
          foreach ($script in (Get-ChildItem installers,scripts -Filter *.ps1 -Recurse)) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

      - name: Test Windows PowerShell 5.1 upgrade functions
        shell: powershell
        run: .\tests\test_upgrade_functions.ps1

      - name: Resolve Hermes source
        shell: bash
        env:
          HERMES_TAG_INPUT: ${{ github.event.inputs.hermes_tag || '' }}
        run: |
          set -euo pipefail
          mkdir -p build
          args=()
          if [ -n "$HERMES_TAG_INPUT" ]; then
            args+=(--tag "$HERMES_TAG_INPUT")
          fi
          python packaging/resolve_hermes_source.py "${args[@]}" | tee build/hermes-source.env
          cat build/hermes-source.env >> "$GITHUB_ENV"
          awk -F= '/^HERMES_UPSTREAM_TAG=/{print substr($0, index($0, "=") + 1)}' build/hermes-source.env > build/hermes-upstream-tag.txt

      - name: Build wheelhouse
        shell: bash
        run: python packaging/build_wheelhouse.py --platform win-x64 --extras "${{ github.event.inputs.hermes_extras || 'all' }}" --output build/wheelhouse

      - name: Read Hermes Agent version
        shell: bash
        run: python packaging/read_hermes_version.py --wheelhouse build/wheelhouse > build/hermes-agent-version.txt

      - name: Build bundle
        shell: bash
        run: python packaging/build_bundle.py --platform win-x64 --wheelhouse build/wheelhouse --output dist

      - name: Generate checksums
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          for file in *.zip *.tar.gz; do
            [ -e "$file" ] || continue
            sha256sum "$file" > "$file.sha256"
          done

      - name: Prepare release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < build/hermes-agent-version.txt)"
          if [ -z "$version" ]; then
            echo "Hermes Agent version is empty" >&2
            exit 1
          fi
          upstream_tag="$(tr -d '[:space:]' < build/hermes-upstream-tag.txt)"
          if [ -z "$upstream_tag" ]; then
            echo "Hermes upstream tag is empty" >&2
            exit 1
          fi
          tag="v${version}-${GITHUB_RUN_NUMBER}"
          previous_tag="$(git tag --list 'v*' --sort=-creatordate | head -n 1 || true)"
          if [ -n "$previous_tag" ]; then
            changes="$(git log --pretty=format:'- %s (%h)' "${previous_tag}..HEAD")"
          else
            changes="$(git log --pretty=format:'- %s (%h)' -n 20)"
          fi
          if [ -z "$changes" ]; then
            changes="- No repository changes detected for this build."
          fi
          {
            echo "hermes_version=$version"
            echo "hermes_upstream_tag=$upstream_tag"
            echo "tag=$tag"
            echo "changes<<EOF"
            echo "$changes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: ${{ github.event_name == 'workflow_dispatch' && inputs.update_root_latest && 'true' || 'false' }}
          name: Hermes Agent ${{ steps.release.outputs.hermes_version }} build ${{ github.run_number }}
          body: |
            Hermes Agent version: ${{ steps.release.outputs.hermes_version }}
            Hermes upstream tag: ${{ steps.release.outputs.hermes_upstream_tag }}
            GitHub Actions run: ${{ github.run_number }}
            Packaging commit: ${{ github.sha }}

            Changes in this build:
            ${{ steps.release.outputs.changes }}
          files: dist/*

      - name: Prepare local OSS upload files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          cp dist/* upload/

      - name: Prepare OSS metadata
        id: meta
        shell: bash
        env:
          ALIYUN_OSS_PREFIX: ${{ vars.ALIYUN_OSS_PREFIX || 'hermes' }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < build/hermes-agent-version.txt)"
          if [ -z "$version" ]; then
            echo "Hermes Agent version is empty" >&2
            exit 1
          fi
          upstream_tag="$(tr -d '[:space:]' < build/hermes-upstream-tag.txt)"
          if [ -z "$upstream_tag" ]; then
            echo "Hermes upstream tag is empty" >&2
            exit 1
          fi
          build_version="${version}-${GITHUB_RUN_NUMBER}"
          path_prefix="${ALIYUN_OSS_PREFIX%/}/${build_version}"
          {
            echo "hermes_version=$version"
            echo "hermes_upstream_tag=$upstream_tag"
            echo "build_version=$build_version"
            echo "path_prefix=$path_prefix"
          } >> "$GITHUB_OUTPUT"

      - name: Generate latest.json
        shell: bash
        env:
          ALIYUN_OSS_PUBLIC_BASE_URL: ${{ secrets.ALIYUN_OSS_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${ALIYUN_OSS_PUBLIC_BASE_URL:-}" ]; then
            echo "ALIYUN_OSS_PUBLIC_BASE_URL is required" >&2
            exit 1
          fi
          version="${{ steps.meta.outputs.build_version }}"
          path_prefix="${{ steps.meta.outputs.path_prefix }}"
          zip_name="$(find upload -maxdepth 1 -type f -name 'hermes-offline-installer-win-x64.zip' -print -quit)"
          if [ -z "$zip_name" ]; then
            echo "Windows zip not found in upload/" >&2
            exit 1
          fi
          zip_name="$(basename "$zip_name")"
          cat > upload/latest.json <<EOF
          {
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "upstream_tag": "${{ steps.meta.outputs.hermes_upstream_tag }}",
            "editions": {
              "en": { "version": "$version", "base_url": "${ALIYUN_OSS_PUBLIC_BASE_URL%/}/$path_prefix/$zip_name" }
            }
          }
          EOF

      - name: Install OSS SDK
        run: python -m pip install oss2

      - name: Upload files to OSS
        shell: bash
        timeout-minutes: 20
        env:
          OSS_VERSION_PREFIX: ${{ steps.meta.outputs.path_prefix }}
          UPDATE_ROOT_LATEST: ${{ github.event_name == 'workflow_dispatch' && inputs.update_root_latest && 'true' || 'false' }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_PREFIX: ${{ vars.ALIYUN_OSS_PREFIX || 'hermes' }}
        run: |
          set -euo pipefail
          python -u scripts/upload_oss.py --directory upload --path-prefix "$OSS_VERSION_PREFIX"
