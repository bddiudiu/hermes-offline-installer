model:
  default: qwen3
  provider: custom:zhan_ai
  supports_vision: true

providers:
  zhan_ai:
    api: "${ZHANCLAW_BASE_URL}"
    key_env: ZHANCLAW_API_KEY
    models:
      - qwen3

platform_toolsets:
  api_server:
    - hermes-api-server

terminal:
  backend: local

platforms:
  api_server:
    enabled: true
    extra:
      port: 8642
