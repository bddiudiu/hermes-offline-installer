model:
  default: gpt-4o-mini
  provider: custom:zhan_ai

providers:
  zhan_ai:
    api: "${ZHANCLAW_BASE_URL}"
    key_env: ZHANCLAW_API_KEY

platform_toolsets:
  api_server:
    - hermes-api-server

terminal:
  backend: local

platforms:
  api_server:
    enabled: true
    extra:
      port: 8642
